name: Build and Publish Save Mounter Batch

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
    paths:
      - '**'
  workflow_dispatch:

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  windows_verify:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Verify compressed portable executable
      shell: pwsh
      run: |
        dotnet publish PS5SavefileBatcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./smoke-package
        if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
        $app = Join-Path $PWD 'smoke-package/PS5 Savefile Batcher.exe'
        $process = Start-Process -FilePath $app -ArgumentList '--smoke smoke-result.txt' -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru
        if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Portable smoke test timed out' }
        if ($process.ExitCode -ne 0) { throw 'Portable smoke test failed' }
        Get-Content (Join-Path $env:RUNNER_TEMP 'smoke-result.txt')

  build_and_release:
    needs: windows_verify
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 llvm-18-dev lld-18 bsdextrautils

    - name: Checkout PS5 payload SDK
      uses: actions/checkout@v4
      with:
        repository: ps5-payload-dev/sdk
        ref: f5d40f02770e9b0001dd9e18056eca70b3da8b40
        submodules: recursive
        path: ps5-payload-sdk

    - name: Build and install SDK
      run: |
        export PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/ps5-sdk"
        make -C ps5-payload-sdk DESTDIR="$PS5_PAYLOAD_SDK" clean install
        echo "PS5_PAYLOAD_SDK=$PS5_PAYLOAD_SDK" >> "$GITHUB_ENV"

    - name: Build mounter payload
      run: make -C mounter_payload

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install Linux desktop test dependencies
      run: |
        sudo apt-get install -y xvfb xauth libfontconfig1 libfreetype6 libx11-6 libxext6 libxrender1 libxrandr2 libxi6 libxcursor1 libice6 libsm6 libgl1

    - name: Verify Linux portable application
      run: |
        bash build-linux.sh
        APPIMAGES=("$PWD"/publish/*-linux-x86_64-v*.AppImage)
        test "${#APPIMAGES[@]}" -eq 1
        "${APPIMAGES[0]}" --appimage-extract-and-run --version
        timeout 60s xvfb-run -a "${APPIMAGES[0]}" --appimage-extract-and-run --smoke "$RUNNER_TEMP/linux-smoke.txt" 2>"$RUNNER_TEMP/linux-smoke.stderr"
        python3 -c 'import pathlib,sys; result=pathlib.Path(sys.argv[1]).read_text(); errors=pathlib.Path(sys.argv[2]).read_text(); print(result); print(errors,file=sys.stderr); sys.exit(0 if "selection OK" in result and not errors.strip() else 1)' "$RUNNER_TEMP/linux-smoke.txt" "$RUNNER_TEMP/linux-smoke.stderr"

    - name: Publish
      run: |
        dotnet publish PS5SavefileBatcher.csproj --configuration Release \
          -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:EnableWindowsTargeting=true --output ./publish/win-x64
        cp mounter_payload/savemounter.elf ./publish/win-x64/
        cp LICENSE README.md ./publish/win-x64/
        cp ADVANCED.md LINUX.md README.upstream.md SOURCES.md THIRD-PARTY-NOTICES.md ./publish/win-x64/
        cp -r Licenses ./publish/win-x64/
        VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' PS5SavefileBatcher.csproj)
        printf 'Matching source code and build scripts: https://github.com/Piece-OK/PS5-Savefile-Batcher/releases/tag/v%s\nDownload the automatic Source code (zip) or Source code (tar.gz) from that release. Build scripts and upstream source snapshots are included; they are not needed to run the app.\n' "$VERSION" > ./publish/win-x64/SOURCE-CODE.txt
        cd ./publish/win-x64
        zip -r "../PS5-Savefile-Batcher-win-x64-v${VERSION}.zip" ./*

    - name: Attest
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: |
          ./publish/PS5-Savefile-Batcher-win-x64-v*.zip
          ./publish/*-linux-x86_64-v*.AppImage

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: save-mounter
        path: |
          ./publish/PS5-Savefile-Batcher-win-x64-v*.zip
          ./publish/*-linux-x86_64-v*.AppImage

    - name: Create or Update GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        ASSETS=(./publish/PS5-Savefile-Batcher-win-x64-v*.zip ./publish/*-linux-x86_64-v*.AppImage)
        if gh release view "$TAG_NAME" > /dev/null 2>&1; then
          echo "Release $TAG_NAME already exists. Uploading assets..."
          gh release upload "$TAG_NAME" "${ASSETS[@]}"
        else
          echo "Creating new release $TAG_NAME..."
          gh release create "$TAG_NAME" --verify-tag --draft --prerelease --latest=false --title "$TAG_NAME" "${ASSETS[@]}" --notes "Download the versioned Windows ZIP or Linux x86_64 AppImage to run the app. Matching source, build scripts and upstream source snapshots are included in GitHub's automatic Source code (zip/tar.gz) downloads on this release. See LINUX.md for Linux requirements and validation limits."
        fi
