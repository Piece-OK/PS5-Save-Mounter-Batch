name: Build and Publish Save Mounter Batch

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
    paths:
      - '**'
  workflow_dispatch:

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  windows_tests:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Verify client and batch behavior
      run: dotnet run --project tests/Dumper.Tests.csproj -c Release
    - name: Verify compressed portable executable
      shell: pwsh
      run: |
        dotnet publish PS4Saves.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./smoke-package
        if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
        $app = Join-Path $PWD 'smoke-package/PS5 Save Mounter Batch.exe'
        $process = Start-Process -FilePath $app -ArgumentList '--smoke smoke-result.txt' -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru
        if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Portable smoke test timed out' }
        if ($process.ExitCode -ne 0) { throw 'Portable smoke test failed' }
        Get-Content (Join-Path $env:RUNNER_TEMP 'smoke-result.txt')

  build_and_release:
    needs: windows_tests
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 llvm-18-dev lld-18 bsdextrautils

    - name: Checkout PS5 payload SDK
      uses: actions/checkout@v4
      with:
        repository: ps5-payload-dev/sdk
        ref: f5d40f02770e9b0001dd9e18056eca70b3da8b40
        submodules: recursive
        path: ps5-payload-sdk

    - name: Build and install SDK
      run: |
        export PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/ps5-sdk"
        make -C ps5-payload-sdk DESTDIR="$PS5_PAYLOAD_SDK" clean install
        echo "PS5_PAYLOAD_SDK=$PS5_PAYLOAD_SDK" >> "$GITHUB_ENV"

    - name: Build mounter payload
      run: make -C mounter_payload

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: |
        dotnet publish PS4Saves.csproj --configuration Release \
          -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:EnableWindowsTargeting=true --output ./publish/win-x64
        cp mounter_payload/savemounter.elf ./publish/win-x64/
        cp LICENSE README.dumper.md ./publish/win-x64/
        mv ./publish/win-x64/README.dumper.md ./publish/win-x64/README.md
        cp ADVANCED.md README.upstream.md SOURCES.md THIRD-PARTY-NOTICES.md VALIDATION.md ./publish/win-x64/
        cp -r Licenses ./publish/win-x64/
        VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' PS4Saves.csproj)
        printf 'Matching source code and build scripts: https://github.com/Piece-OK/PS5-Save-Mounter-Batch/releases/tag/v%s\nDownload corresponding-source.zip from that release. It is not needed to run the app.\n' "$VERSION" > ./publish/win-x64/SOURCE-CODE.txt
        git archive --format=zip HEAD -o ./publish/corresponding-source.zip
        cd ./publish/win-x64
        zip -r ../PS5-Save-Mounter-Batch-win-x64.zip ./*

    - name: Attest
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: ./publish/PS5-Save-Mounter-Batch-win-x64.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: save-mounter
        path: |
          ./publish/PS5-Save-Mounter-Batch-win-x64.zip
          ./publish/corresponding-source.zip

    - name: Create or Update GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        if gh release view "$TAG_NAME" > /dev/null 2>&1; then
          echo "Release $TAG_NAME already exists. Uploading assets..."
          gh release upload $TAG_NAME ./publish/PS5-Save-Mounter-Batch-win-x64.zip ./publish/corresponding-source.zip
        else
          echo "Creating new release $TAG_NAME..."
          gh release create $TAG_NAME --verify-tag -d ./publish/PS5-Save-Mounter-Batch-win-x64.zip ./publish/corresponding-source.zip --notes "Download the Windows ZIP to run the app. Matching source and build scripts are available separately in corresponding-source.zip on this release."
        fi
